# Stack chính: Postgres, Redis, backend, frontend.
# Trên máy dev, Docker tự ghép thêm compose.override.yml — xem DOCKER_COMPOSE.md.
services:
  db:
    image: postgres:16-alpine
    container_name: saree-db
    environment:
      POSTGRES_USER: saree
      POSTGRES_PASSWORD: 2nl2ull7
      POSTGRES_DB: saree-erp-project
    ports:
      - "5432:5432"
    volumes:
      - saree-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saree -d saree"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: saree-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: saree-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core app
      ENVIRONMENT: local
      PROJECT_NAME: "Saree ERP"
      SECRET_KEY: "dev-secret-change-me"

      # DB
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: saree
      POSTGRES_PASSWORD: saree
      POSTGRES_DB: saree

      # Redis
      REDIS_URL: "redis://redis:6379/0"

      # First superuser (created by app/initial_data.py)
      FIRST_SUPERUSER: "admin@saree-process.demo"
      FIRST_SUPERUSER_PASSWORD: "AdminDemo2024!"

      # CORS / frontend
      FRONTEND_HOST: "http://localhost:5173"
      BACKEND_CORS_ORIGINS: "http://localhost:5173"

      # NOTE: auto-reset removed from default compose to prevent accidental wipe.
      # Use compose.override.yml or run manually: docker compose exec backend python -m app.scripts.reset_saree_process_demo --confirm
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8111:8111"
    command:
      [
        "bash",
        "-lc",
        "scripts/prestart.sh && uvicorn app.main:app --host 0.0.0.0 --port 8111",
      ]

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: saree-celery-worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      SECRET_KEY: "dev-secret-change-me"
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: saree
      POSTGRES_PASSWORD: saree
      POSTGRES_DB: saree
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./uploads:/app/uploads
    command:
      [
        "bash",
        "-lc",
        "celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2",
      ]

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: saree-celery-beat
    depends_on:
      - redis
      - db
    environment:
      ENVIRONMENT: local
      SECRET_KEY: "dev-secret-change-me"
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: saree
      POSTGRES_PASSWORD: saree
      POSTGRES_DB: saree
      REDIS_URL: "redis://redis:6379/0"
    command:
      [
        "bash",
        "-lc",
        "celery -A app.core.celery_app.celery_app beat --loglevel=info",
      ]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:8111"
    container_name: saree-frontend
    environment:
      - BACKEND_PORT=8111
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  saree-postgres-data:
