<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saree</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#123a72" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root">
      <div id="app-splash" style="
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        background:#f4f8ff;z-index:9999;gap:16px;
      ">
        <img src="/assets/saree_image/logo_saree.png" width="120" height="auto" alt="Saree ERP" />
        <div style="
          width:32px;height:32px;border:3px solid #d7e4f7;
          border-top-color:#1d6ee8;border-radius:50%;
          animation:spin 0.8s linear infinite;
        "></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      // Remove splash once React mounts
      document.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => {
          const root = document.getElementById('root')
          if (root && root.children.length > 1) {
            const splash = document.getElementById('app-splash')
            if (splash) splash.remove()
            observer.disconnect()
          }
        })
        observer.observe(document.getElementById('root'), { childList: true })
      })
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
