services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN?Variable not set}
      # cloudflared's cgo resolver bypasses resolv.conf and hard-codes a query to
      # 127.0.0.53 (systemd-resolved's stub), which doesn't exist in the container
      # netns — force Go's pure-Go resolver so it actually reads /etc/resolv.conf
      # (and resolves other container names via the Docker embedded DNS at 127.0.0.11).
      - GODEBUG=netdns=go
    networks:
      traefik-public:
        aliases:
          - cloudflared
    dns:
      - 127.0.0.11
      - 8.8.8.8

networks:
  traefik-public:
    external: true
