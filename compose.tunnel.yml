services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN?Variable not set}
    # The cloudflared image's glibc resolver ignores /etc/resolv.conf (it hard-codes
    # a query to 127.0.0.53, systemd-resolved's stub, which doesn't exist in the
    # container netns) and GODEBUG=netdns=go has no effect since this build lacks a
    # pure-Go resolver fallback. /etc/hosts lookups bypass DNS entirely regardless of
    # resolver backend, so pin the origin containers' current IPs here as a workaround.
    # NOTE: these IPs can change if saree-prod/-dev is recreated — re-check with
    # `docker inspect <container> --format '{{(index .NetworkSettings.Networks "traefik-public").IPAddress}}'`
    # and update this file if the tunnel starts 502'ing again.
    extra_hosts:
      - "saree-prod-frontend-1:172.18.0.6"
      - "saree-prod-backend-1:172.18.0.5"
    networks:
      traefik-public:
        aliases:
          - cloudflared
    dns:
      - 127.0.0.11
      - 8.8.8.8

networks:
  traefik-public:
    external: true
