services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN?Variable not set}
    volumes:
      # See cloudflared-nsswitch.conf: drops the systemd "resolve" NSS module so
      # glibc actually honors resolv.conf instead of hard-coding a lookup to
      # 127.0.0.53 (which doesn't exist in this container's netns).
      - ./cloudflared-nsswitch.conf:/etc/nsswitch.conf:ro
    networks:
      traefik-public:
        aliases:
          - cloudflared
    dns:
      - 127.0.0.11
      - 8.8.8.8

networks:
  traefik-public:
    external: true
