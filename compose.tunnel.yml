services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN?Variable not set}
    networks:
      traefik-public:
        aliases:
          - cloudflared
    dns:
      - 127.0.0.11
      - 8.8.8.8

networks:
  traefik-public:
    external: true
