name: Deploy Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, production]
    if: github.ref == 'refs/heads/releases' && github.event_name == 'workflow_dispatch'

    env:
      STACK_NAME: saree-prod
      DOMAIN: sareeref.vn
      ENVIRONMENT: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        shell: cmd
        run: |
          (
            echo ENVIRONMENT=%ENVIRONMENT%
            echo DOMAIN=%DOMAIN%
            echo STACK_NAME=%STACK_NAME%
            echo PROJECT_NAME=Saree ERP
            echo DOCKER_IMAGE_BACKEND=saree-backend
            echo DOCKER_IMAGE_FRONTEND=saree-frontend
            echo TAG=latest
            echo SECRET_KEY=%SECRET_KEY%
            echo POSTGRES_SERVER=db
            echo POSTGRES_PORT=5432
            echo POSTGRES_DB=saree-erp-project
            echo POSTGRES_USER=saree
            echo POSTGRES_PASSWORD=%POSTGRES_PASSWORD%
            echo FIRST_SUPERUSER=%FIRST_SUPERUSER%
            echo FIRST_SUPERUSER_PASSWORD=%FIRST_SUPERUSER_PASSWORD%
            echo FRONTEND_HOST=https://dashboard.%DOMAIN%
            echo BACKEND_CORS_ORIGINS=https://dashboard.%DOMAIN%
            echo PUBLIC_BASE_URL=https://api.%DOMAIN%
            echo VITE_API_URL=https://api.%DOMAIN%
            echo APP_BUILD=%GITHUB_SHA:~0,7%
            echo SMTP_HOST=%SMTP_HOST%
            echo SMTP_USER=%SMTP_USER%
            echo SMTP_PASSWORD=%SMTP_PASSWORD%
            echo EMAILS_FROM_EMAIL=%SMTP_USER%
            echo REPORT_RECIPIENTS=%REPORT_RECIPIENTS%
            echo VAPID_PRIVATE_KEY=%VAPID_PRIVATE_KEY%
            echo VAPID_PUBLIC_KEY=%VAPID_PUBLIC_KEY%
            echo SENTRY_DSN=
          ) > .env
        env:
          SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.PROD_FIRST_SUPERUSER_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

      - name: Debug .env
        shell: cmd
        run: |
          echo --- listing workspace ---
          dir
          echo --- .env content (passwords masked by GH) ---
          type .env

      - name: Docker Compose up
        shell: cmd
        run: |
          docker compose --env-file .env -f compose.prod.yml -p %STACK_NAME% up --build -d

      - name: Health check
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$ok = $false; for ($i = 0; $i -lt 60; $i++) { $h = (docker inspect --format='{{.State.Health.Status}}' saree-prod-backend-1 2>$null); if ($h -eq 'healthy') { $ok = $true; break }; Start-Sleep -Seconds 3 }; if (-not $ok) { docker logs --tail 200 saree-prod-backend-1; throw 'Backend health check timed out' }"

      - name: Prune old images and build cache
        if: always()
        shell: cmd
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=168h"
          docker system df
