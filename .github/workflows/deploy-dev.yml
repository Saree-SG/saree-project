name: Deploy Dev

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    if: github.ref == 'refs/heads/dev'

    env:
      FRONTEND_PORT: "3000"
      BACKEND_PORT: "8100"
      ADMINER_PORT: "8282"
      STACK_NAME: saree-dev
      DOMAIN: localhost
      ENVIRONMENT: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        shell: powershell
        run: |
          $envLines = @(
            "ENVIRONMENT=$env:ENVIRONMENT"
            "DOMAIN=$env:DOMAIN"
            "PROJECT_NAME=Saree ERP"
            "DOCKER_IMAGE_BACKEND=saree-backend"
            "DOCKER_IMAGE_FRONTEND=saree-frontend"
            "TAG=latest"
            "SECRET_KEY=$env:SECRET_KEY"
            "POSTGRES_PASSWORD=$env:POSTGRES_PASSWORD"
            "FIRST_SUPERUSER=$env:FIRST_SUPERUSER"
            "FIRST_SUPERUSER_PASSWORD=$env:FIRST_SUPERUSER_PASSWORD"
            "POSTGRES_SERVER=db"
            "POSTGRES_PORT=5432"
            "POSTGRES_DB=saree-erp-project"
            "POSTGRES_USER=saree"
            "FRONTEND_HOST=http://localhost:$env:FRONTEND_PORT"
            "BACKEND_CORS_ORIGINS=http://localhost:$env:FRONTEND_PORT"
            "PUBLIC_BASE_URL=http://localhost:$env:BACKEND_PORT"
            "VITE_API_URL=http://localhost:$env:BACKEND_PORT"
            "SMTP_HOST="
            "SMTP_USER="
            "SMTP_PASSWORD="
            "EMAILS_FROM_EMAIL="
            "SENTRY_DSN="
          )
          Set-Content -Path ".env" -Value $envLines -Encoding UTF8
        env:
          SECRET_KEY: ${{ secrets.DEV_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.DEV_FIRST_SUPERUSER_PASSWORD }}

      - name: Docker Compose up
        shell: powershell
        run: |
          docker compose -f compose.local.yml -p saree-dev up --build -d

      - name: Health check
        shell: powershell
        run: |
          $backendUrl = "http://127.0.0.1:$env:BACKEND_PORT/api/v1/utils/health-check/"
          $frontendUrl = "http://127.0.0.1:$env:FRONTEND_PORT/"
          $ok = $false

          for ($i = 0; $i -lt 30; $i++) {
            try {
              Invoke-WebRequest -Uri $backendUrl -UseBasicParsing | Out-Null
              $ok = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $ok) {
            throw "Backend health check timed out"
          }

          Invoke-WebRequest -Uri $frontendUrl -UseBasicParsing | Out-Null
