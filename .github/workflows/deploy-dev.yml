name: Deploy Dev

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    if: github.ref == 'refs/heads/dev'

    env:
      FRONTEND_PORT: "3000"
      BACKEND_PORT: "8100"
      ADMINER_PORT: "8282"
      STACK_NAME: saree-dev
      DOMAIN: localhost
      ENVIRONMENT: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        shell: cmd
        run: |
          (
            echo ENVIRONMENT=%ENVIRONMENT%
            echo DOMAIN=%DOMAIN%
            echo PROJECT_NAME=Saree ERP
            echo DOCKER_IMAGE_BACKEND=saree-backend
            echo DOCKER_IMAGE_FRONTEND=saree-frontend
            echo TAG=latest
            echo SECRET_KEY=%SECRET_KEY%
            echo POSTGRES_PASSWORD=%POSTGRES_PASSWORD%
            echo FIRST_SUPERUSER=%FIRST_SUPERUSER%
            echo FIRST_SUPERUSER_PASSWORD=%FIRST_SUPERUSER_PASSWORD%
            echo POSTGRES_SERVER=db
            echo POSTGRES_PORT=5432
            echo POSTGRES_DB=saree-erp-project
            echo POSTGRES_USER=saree
            echo FRONTEND_HOST=http://localhost:%FRONTEND_PORT%
            echo BACKEND_CORS_ORIGINS=http://localhost:%FRONTEND_PORT%
            echo PUBLIC_BASE_URL=http://localhost:%BACKEND_PORT%
            echo VITE_API_URL=http://localhost:%BACKEND_PORT%
            echo SMTP_HOST=
            echo SMTP_USER=
            echo SMTP_PASSWORD=
            echo EMAILS_FROM_EMAIL=
            echo SENTRY_DSN=
          ) > .env
        env:
          SECRET_KEY: ${{ secrets.DEV_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.DEV_FIRST_SUPERUSER_PASSWORD }}

      - name: Docker Compose up
        shell: cmd
        run: |
          docker compose -f compose.local.yml -p saree-dev up --build -d

      - name: Health check
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$backendUrl = 'http://127.0.0.1:%BACKEND_PORT%/api/v1/utils/health-check/'; $frontendUrl = 'http://127.0.0.1:%FRONTEND_PORT%/'; $ok = $false; for ($i = 0; $i -lt 30; $i++) { try { Invoke-WebRequest -Uri $backendUrl -UseBasicParsing ^| Out-Null; $ok = $true; break } catch { Start-Sleep -Seconds 2 } }; if (-not $ok) { throw 'Backend health check timed out' }; Invoke-WebRequest -Uri $frontendUrl -UseBasicParsing ^| Out-Null"
