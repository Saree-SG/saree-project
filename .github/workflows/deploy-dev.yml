name: Deploy Dev

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    if: github.ref == 'refs/heads/dev'

    env:
      STACK_NAME: saree-dev
      DOMAIN: sareeref.vn
      ENVIRONMENT: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        run: |
          cat > .env <<EOF
          ENVIRONMENT=${ENVIRONMENT}
          DOMAIN=${DOMAIN}
          STACK_NAME=${STACK_NAME}
          PROJECT_NAME=Saree ERP dev
          DOCKER_IMAGE_BACKEND=saree-backend-dev
          DOCKER_IMAGE_FRONTEND=saree-frontend-dev
          TAG=latest
          SECRET_KEY=${SECRET_KEY}
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_DB=saree-erp-project
          POSTGRES_USER=saree
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          FIRST_SUPERUSER=${FIRST_SUPERUSER}
          FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
          FRONTEND_HOST=https://dev-dashboard.${DOMAIN}
          BACKEND_CORS_ORIGINS=https://dev-dashboard.${DOMAIN}
          PUBLIC_BASE_URL=https://dev-api.${DOMAIN}
          VITE_API_URL=https://dev-api.${DOMAIN}
          APP_BUILD=${GITHUB_SHA:0:7}
          SMTP_HOST=${SMTP_HOST}
          SMTP_USER=${SMTP_USER}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          EMAILS_FROM_EMAIL=${SMTP_USER}
          REPORT_RECIPIENTS=${REPORT_RECIPIENTS}
          VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
          VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
          SENTRY_DSN=
          EOF
        env:
          SECRET_KEY: ${{ secrets.DEV_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.DEV_FIRST_SUPERUSER_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

      - name: Debug .env
        run: |
          echo "--- listing workspace ---"
          ls -la
          echo "--- .env content (passwords masked by GH) ---"
          cat .env

      - name: Docker Compose up
        run: |
          docker compose --env-file .env -f compose.prod.yml -p "$STACK_NAME" up --build -d

      - name: Health check
        run: |
          ok=false
          for i in $(seq 1 60); do
            h=$(docker inspect --format='{{.State.Health.Status}}' saree-dev-backend-1 2>/dev/null || true)
            if [ "$h" = "healthy" ]; then
              ok=true
              break
            fi
            sleep 3
          done
          if [ "$ok" != "true" ]; then
            docker logs --tail 200 saree-dev-backend-1
            echo "Backend health check timed out"
            exit 1
          fi

      - name: Prune old images and build cache
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=168h"
          docker system df
