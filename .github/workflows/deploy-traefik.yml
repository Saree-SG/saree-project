name: Deploy Traefik

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted]

    env:
      DOMAIN: erp.sareeref.vn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure traefik-public network
        run: |
          docker network inspect traefik-public >/dev/null 2>&1 || docker network create traefik-public

      - name: Docker Compose up Traefik
        env:
          EMAIL: ${{ secrets.TRAEFIK_EMAIL }}
          USERNAME: ${{ secrets.TRAEFIK_USERNAME }}
          HASHED_PASSWORD: ${{ secrets.TRAEFIK_HASHED_PASSWORD }}
        run: |
          docker compose -f compose.traefik.yml -p traefik up -d

      - name: Show Traefik logs (tail)
        run: |
          docker logs --tail 80 traefik-traefik-1
