name: Deploy Tunnel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env.tunnel
        run: |
          echo "CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}" > .env.tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

      - name: Docker Compose up
        run: |
          docker compose --env-file .env.tunnel -f compose.tunnel.yml -p saree-tunnel up -d --pull missing

      - name: Check tunnel status
        run: |
          docker logs saree-tunnel-cloudflared-1 --tail 20
