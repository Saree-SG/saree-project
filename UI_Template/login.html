<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary": "#7b5900",
              "secondary-dim": "#525354",
              "inverse-primary": "#5c97ff",
              "on-secondary-fixed": "#3e4040",
              "on-tertiary": "#fff8f1",
              "surface-container-high": "#e4e9ea",
              "surface-dim": "#d3dbdd",
              "surface-variant": "#dde4e5",
              "primary-fixed-dim": "#c2d4ff",
              "surface-container-lowest": "#ffffff",
              "on-surface-variant": "#596061",
              "inverse-on-surface": "#9c9d9d",
              "secondary-container": "#e2e2e2",
              "primary": "#035bbf",
              "on-tertiary-fixed": "#3e2b00",
              "on-tertiary-fixed-variant": "#624600",
              "on-surface": "#2d3435",
              "surface-container-low": "#f2f4f4",
              "inverse-surface": "#0c0f0f",
              "background": "#f9f9f9",
              "on-primary": "#f7f7ff",
              "tertiary-fixed-dim": "#edb223",
              "error": "#9f403d",
              "on-primary-container": "#004fa8",
              "error-container": "#fe8983",
              "outline-variant": "#acb3b4",
              "outline": "#757c7d",
              "primary-dim": "#004fa9",
              "on-primary-fixed": "#003d85",
              "tertiary-container": "#fcc032",
              "surface-bright": "#f9f9f9",
              "surface": "#f9f9f9",
              "error-dim": "#4e0309",
              "tertiary-fixed": "#fcc032",
              "tertiary-dim": "#6c4e00",
              "on-tertiary-container": "#563e00",
              "on-error": "#fff7f6",
              "on-secondary": "#f9f9f9",
              "on-secondary-fixed-variant": "#5a5c5c",
              "secondary-fixed": "#e2e2e2",
              "primary-container": "#d8e2ff",
              "on-primary-fixed-variant": "#0058bb",
              "primary-fixed": "#d8e2ff",
              "secondary": "#5e5f60",
              "surface-container": "#ebeeef",
              "surface-container-highest": "#dde4e5",
              "secondary-fixed-dim": "#d4d4d4",
              "on-background": "#2d3435",
              "surface-tint": "#035bbf",
              "on-error-container": "#752121",
              "on-secondary-container": "#505252"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background flex flex-col min-h-screen">
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 relative overflow-hidden">
<!-- Background Decorative Elements -->
<div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-primary-container rounded-full blur-3xl opacity-40"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-80 h-80 bg-tertiary-container rounded-full blur-3xl opacity-20"></div>
<!-- Branding Header -->
<div class="z-10 text-center mb-10">
<div class="inline-flex items-center justify-center w-20 h-20 bg-primary rounded-xl mb-4 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="corporate_fare">corporate_fare</span>
</div>
<h1 class="text-3xl font-extrabold text-on-surface tracking-tight font-headline">ERP Core</h1>
<p class="text-on-surface-variant mt-2 font-medium">Hệ thống Quản trị Doanh nghiệp</p>
</div>
<!-- Login Card -->
<div class="z-10 w-full max-w-sm glass-panel border border-white/40 shadow-2xl rounded-xl p-8">
<form action="#" class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface" for="email">Email của bạn</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-4 bg-surface-container-low border-none rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:bg-white transition-all text-base" id="email" name="email" placeholder="ten@congty.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-sm font-semibold text-on-surface" for="password">Mật khẩu</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-11 pr-12 py-4 bg-surface-container-low border-none rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:bg-white transition-all text-base" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="text-sm font-medium text-primary hover:text-primary-dim transition-colors" href="#">Quên mật khẩu?</a>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary transition-all" id="remember" name="remember" type="checkbox"/>
<label class="ml-3 block text-sm text-on-surface-variant" for="remember">Ghi nhớ đăng nhập</label>
</div>
<!-- Login Button -->
<button class="w-full bg-primary text-on-primary font-bold py-4 rounded-lg shadow-lg shadow-primary/30 hover:bg-primary-dim active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Đăng Nhập
                    <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Help -->
<div class="z-10 mt-12 text-center text-sm text-on-surface-variant">
<p>Bạn gặp vấn đề khi đăng nhập?</p>
<a class="inline-flex items-center gap-1 font-semibold text-primary mt-1" href="#">
                Liên hệ IT Support
                <span class="material-symbols-outlined text-xs" data-icon="open_in_new">open_in_new</span>
</a>
</div>
<!-- Illustration Background (Bento/Asymmetric Style) -->
<div class="absolute bottom-4 left-4 w-24 h-24 bg-surface-container rounded-2xl -z-0 rotate-12 opacity-50"></div>
<div class="absolute top-20 right-4 w-16 h-16 border-2 border-primary/20 rounded-full -z-0 opacity-40"></div>
<div class="absolute bottom-24 right-[-20px] w-32 h-32 bg-secondary-container rounded-[2rem] -z-0 -rotate-12 opacity-40"></div>
</main>
<!-- Success Feedback Hidden Elements (Accessibility) -->
<div class="hidden">
<span data-icon="notifications">notifications</span>
<span data-icon="help">help</span>
<span data-icon="person">person</span>
<span data-icon="lock" data-weight="fill">lock</span>
<span data-icon="account_tree">account_tree</span>
<span data-icon="language">language</span>
<span data-icon="translate">translate</span>
</div>
</body></html>
