# Minimal glibc NSS config for the cloudflared container.
#
# The default cloudflared image ships an /etc/nsswitch.conf with the "resolve"
# module (from libnss-resolve), which makes glibc's resolver always query
# systemd-resolved's stub at 127.0.0.53 directly — bypassing /etc/resolv.conf
# entirely. That stub doesn't exist inside the container's network namespace,
# so lookups of sibling container names (e.g. saree-prod-frontend-1) fail with
# "server misbehaving" even though resolv.conf correctly points at Docker's
# embedded DNS (127.0.0.11). Dropping the "resolve" module here forces plain
# DNS resolution via resolv.conf, which works correctly in the container.
passwd:         files
group:          files
shadow:         files
hosts:          files dns
networks:       files
protocols:      files
services:       files
ethers:         files
rpc:            files
